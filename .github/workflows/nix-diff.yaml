name: Post packages diff link

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  diff-link:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Post or update diff link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NIX_DIFFS_TRACK_AUTH: ${{ secrets.NIX_DIFFS_TRACK_AUTH }}
        run: |
          set -euo pipefail

          marker="<!-- nix-diff-link -->"
          url="https://builder.oa.ke/diff/${REPO}/${BASE_SHA}/${HEAD_SHA}"
          printf '%s\n[![nix-diffs status](%s/badge.svg)](%s)\n\n[See what packages this PR changes ->](%s)\n' \
            "$marker" "$url" "$url" "$url" > body.md

          id=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | sed -n '1p')

          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -F body=@body.md
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" -F body=@body.md
          fi

          curl --fail --silent --show-error --user "$NIX_DIFFS_TRACK_AUTH" --request POST \
            "https://builder.oa.ke/diff/api/comparisons/${REPO}/${BASE_SHA}/${HEAD_SHA}/track" >/dev/null
